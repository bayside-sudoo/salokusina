<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/recipe-setup" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>Isulat ang Resipe</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="editor-container">
    <h2>{{ title }}</h2>
    <p style="color: gray; margin-bottom: 20px;">Kategorya: {{ category }}</p>

    <!-- Attachment para sa Picture o Video -->
    <ion-item lines="none" style="margin-bottom: 15px;">
      <ion-label position="stacked">Mag-attach ng Larawan o Video</ion-label>
      <input type="file" accept="image/*,video/*" (change)="onFileSelected($event)" style="margin-top: 10px;" />
    </ion-item>

    <!-- Media Preview -->
    <div *ngIf="mediaFile" style="margin-bottom: 15px; text-align: center;">
      <img *ngIf="mediaType === 'image'" [src]="mediaFile" alt="Preview" style="max-width: 100%; max-height: 200px; border-radius: 8px;" />
      <video *ngIf="mediaType === 'video'" [src]="mediaFile" controls style="max-width: 100%; max-height: 200px; border-radius: 8px;"></video>
    </div>

    <!-- Sangkap / Ingredients -->
    <ion-item lines="none" style="margin-bottom: 15px;">
      <ion-textarea rows="5" placeholder="Mga Sangkap (Ingredients)" [(ngModel)]="ingredients"></ion-textarea>
    </ion-item>

    <!-- Hakbang / Instructions -->
    <ion-item lines="none" style="margin-bottom: 20px;">
      <ion-textarea rows="6" placeholder="Mga Hakbang sa Pagluluto (Instructions)" [(ngModel)]="instructions"></ion-textarea>
    </ion-item>

    <!-- Save Button (Walang delete) -->
    <div class="btn-group">
      <ion-button expand="block" (click)="saveRecipe()">
        SAVE RECIPE
      </ion-button>
    </div>

  </div>
</ion-content>
